name: Update OpenShift Client version

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-oc
  cancel-in-progress: false

jobs:
  update-oc:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      # yq and python3 are preinstalled on ubuntu-latest runners
      - name: Check for new OCP version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-oc-version.sh

      # GITHUB_TOKEN may not open PRs in this repository and pushes made with
      # it do not trigger other workflows, so commit directly and dispatch the
      # build explicitly. The script has already verified the client tarball.
      - name: Commit and trigger build if version changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet versions.yaml; then
            echo "No update"
            exit 0
          fi

          VERSION=$(yq '.packages.oc.version' versions.yaml)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.yaml
          git commit -m "chore(deps): update oc to ${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

          gh workflow run build.yaml --ref "${DEFAULT_BRANCH}"
