name: Build RPM Packages

on:
  push:
    branches: [main]
    paths:
      - 'versions.yaml'
      - 'packages/**'
      - 'scripts/**'
      - 'static/**'
      - 'Makefile'
      - '.github/workflows/build.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=goreleaser/nfpm
  NFPM_VERSION: "2.49.0"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y createrepo_c curl tar gzip unzip make yq
          dnf install -y "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm-${NFPM_VERSION}-1.x86_64.rpm"

      - name: Download all binaries
        run: make download

      - name: Build RPMs
        run: make build

      - name: Create repository
        run: make repo

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo/

  deploy:
    needs: [shellcheck, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
